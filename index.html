<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluke Family Christmas Reveal</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:Georgia, serif;
    background:linear-gradient(
        to bottom,
        #163a2d,
        #214d3e
    );
    color:#f7f1e3;
    min-height:100vh;
    overflow-x:hidden;
}
/* SNOW */
.snowflake{
    position:fixed;
    top:-20px;
    color:white;
    opacity:.8;
    pointer-events:none;
    animation:snowFall linear infinite;
}
@keyframes snowFall{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(110vh);
    }
}
/* MAIN CARD */
.card{
    max-width:900px;
    width:92%;
    margin:40px auto;
    background:rgba(11,35,28,.88);
    padding:40px;
    border-radius:20px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
    text-align:center;
}
h1{
    margin-top:0;
    color:#d9b862;
    font-size:2.2rem;
}
.greeting{
    line-height:1.8;
    margin:30px auto;
    max-width:700px;
    font-size:1.05rem;
}
/* GIFT */
.gift{
    width:220px;
    margin-top:20px;
    cursor:pointer;
    transition:all .3s ease;
}

.gift:hover{
    transform:scale(1.05);
}
.giftMessage{
    margin-top:20px;
    color:#f2deb0;
}
.shake{
    animation:shake .7s ease;
}
@keyframes shake{
    0%{transform:rotate(0deg);}
    20%{transform:rotate(-8deg);}
    40%{transform:rotate(8deg);}
    60%{transform:rotate(-8deg);}
    80%{transform:rotate(8deg);}
    100%{transform:rotate(0deg);}
}
/* REVEAL */
.reveal{
    display:none;
    margin-top:35px;
    background:#f7f1e3;
    color:#284b3a;
    border:2px solid #d9b862;
    border-radius:16px;
    padding:30px;
    box-shadow:
        0 0 25px rgba(217,184,98,.35);
}
.recipient{
    font-size:2.4rem;
    font-weight:bold;
    margin-top:15px;
    color:#1f4d38;
}
.complete{
    margin-top:20px;
    color:#7d5c19;
}
.error{
    color:#ffcccc;
}
</style>
</head>
<body>
<div id="snowContainer"></div>
<div class="card">
    <h1>🎄 Fluke Family Christmas Reveal 🎄</h1>
    <div id="content">
        Loading Christmas assignment...
    </div>
    <div id="giftArea" style="display:none;">
        <img
            id="gift"
            class="gift"
            src="images/gift-box.png"
            alt="Gift Box">
        <div class="giftMessage">
