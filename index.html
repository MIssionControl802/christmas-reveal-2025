<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Fluke Family Christmas Mission Control 🎄</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#0b4f3c;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.card{

    max-width:800px;
    width:90%;

    background:#165c47;

    padding:40px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

    text-align:center;
}

h1{
    margin-top:0;
}

button{

    background:#c62828;

    color:white;

    border:none;

    padding:16px 28px;

    border-radius:10px;

    font-size:1.1rem;

    cursor:pointer;

    margin-top:20px;
}

button:hover{
    background:#b71c1c;
}

.reveal{
    display:none;

    margin-top:30px;

    padding:20px;

    background:#ffffff;

    color:#222;

    border-radius:12px;
}

.greeting{
    text-align:left;
    line-height:1.7;
    margin-top:20px;
}

.error{
    color:#ffcccc;
}

</style>

</head>
<body>

<div class="card">

    <h1>🎄 Fluke Family Christmas Mission Control 🎄</h1>

    <div id="content">
        Loading Christmas assignment...
    </div>

</div>

<script>

const contentDiv = document.getElementById("content");

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

if(!code){

    contentDiv.innerHTML = `
        <div class="error">
            <h2>No Secret Code Found</h2>
            <p>Your Christmas transmission is missing its access code.</p>
        </div>
    `;

}
else{

    fetch("./assignments.json")

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Could not load assignments.json"
            );
        }

        return response.json();

    })

    .then(data => {

        const person = data[code];

        if(!person){

            contentDiv.innerHTML = `
                <div class="error">
                    <h2>Invalid Secret Code</h2>
                    <p>Code: ${code}</p>
                </div>
            `;

            return;
        }

        contentDiv.innerHTML = `
            <h2>Welcome ${person["Name"]}</h2>

            <div class="greeting">
                ${person["Reveal Greeting"]}
            </div>

            <button id="revealButton">
                🎁 Reveal My Christmas Assignment
            </button>

            <div id="revealArea" class="reveal">
                <h2>🎁 Your Assigned Recipient 🎁</h2>

                <h1>
                    ${person["Assigned Recipient"]}
                </h1>
            </div>
        `;

        document
            .getElementById("revealButton")
            .addEventListener("click", () => {

                document
                    .getElementById("revealArea")
                    .style.display = "block";

            });

    })

    .catch(error => {

        contentDiv.innerHTML = `
            <div class="error">
                <h2>Error Loading Assignment</h2>
                <p>${error.message}</p>
            </div>
        `;

        console.error(error);

    });

}

</script>

</body>
</html>
