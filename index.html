<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<img
    src="images/ffdelivery-header.png"
    alt="Fluke Family Christmas Reveal"
    class="headerLogo">
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:Georgia, serif;
    background:
        radial-gradient(
            circle at top,
            #24543f,
            #163a2d 70%
        );
}
        radial-gradient(to bottom,#163a2d,#214d3e);
    min-height:100vh;
    overflow-x:hidden;
}
.snowflake{
    position:fixed;
    top:-20px;
    color:white;
    opacity:.8;
    pointer-events:none;
    animation:snowFall linear infinite;
}
@keyframes snowFall{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(110vh);
    }
}
.card{
    max-width:760px;
    width:95%;
    margin:15px auto;
    background:rgba(11,35,28,.92);
    padding:20px;
}
.headerLogo{
    width:100%;
    max-width:650px;
    display:block;
    margin:0 auto 15px auto;
};
}
.greeting{
    line-height:1.5;
    margin:12px auto;
    max-width:700px;
    font-size:1rem;
}
.error{
    color:#ffcccc;
}
.gift{
    width:165px;
    margin-top:20px;
    cursor:pointer;
    transition:all .3s ease;
}
.gift:hover{
    transform:scale(1.05);
}
.giftMessage{
    margin-top:20px;
    color:#f2deb0;
}
.shake{
    animation:shake .7s ease;
}
@keyframes shake{
    0%{transform:rotate(0deg);}
    20%{transform:rotate(-8deg);}
    40%{transform:rotate(8deg);}
    60%{transform:rotate(-8deg);}
    80%{transform:rotate(8deg);}
    100%{transform:rotate(0deg);}
}
.reveal{
    display:none;
    margin-top:35px;
    background:#f7f1e3;
    color:#284b3a;
    border:2px solid #d9b862;
    border-radius:16px;
    padding:30px;
    box-shadow:0 0 25px rgba(217,184,98,.35);
}
.recipient{
    font-size:2.4rem;
    font-weight:bold;
    margin-top:15px;
    color:#1f4d38;
}
.complete{
    margin-top:20px;
    color:#7d5c19;
}
</style>
</head>
<body>
<div id="snowContainer"></div>
<div class="card">
    <h1>🎁 Fluke's North Pole Delivery Service 🎁<h1>
    <div id="content">
        Loading Christmas assignment...
    </div>
    <div id="giftArea" style="display:none;">
        <img
            id="gift"
            class="gift"
            src="images/gift-box.png"
            alt="Gift Box">
        <div class="giftMessage">
            Click the gift to reveal your Christmas assignment
        </div>
    </div>
    <div id="revealArea" class="reveal">
        <h2>🎁 Your Christmas Assignment 🎁</h2>
        <div id="recipientName" class="recipient"></div>
        <div class="complete">
            Mission Complete<br><br>
            The Elf Council thanks you for your service.
        </div>
    </div>
</div>
<script>
const contentDiv = document.getElementById("content");
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
let assignedRecipient = "";
function createSnow(){
    const snowContainer =
        document.getElementById("snowContainer");
    for(let i = 0; i < 70; i++){
        const snow =
            document.createElement("div");
        snow.className = "snowflake";
        snow.innerHTML = "❄";
        snow.style.left =
            Math.random() * 100 + "vw";
        snow.style.fontSize =
            (10 + Math.random() * 15) + "px";
        snow.style.animationDuration =
            (5 + Math.random() * 10) + "s";
        snowContainer.appendChild(snow);
    }
}
createSnow();
fetch("./assignments.json")
.then(response => response.json())
.then(data => {
    const person = data[code];
    if(!person){
        contentDiv.innerHTML =
            '<div class="error">Invalid Secret Code</div>';
        return;
    }
    assignedRecipient =
        person["Assigned Recipient"];
    contentDiv.innerHTML = `
        <h2>Welcome ${person["Name"]}</h2>
        <div class="greeting">
            ${person["Reveal Greeting"]}
        </div>
    `;
    document.getElementById("giftArea")
        .style.display = "none";
})
.catch(error => {
    contentDiv.innerHTML =
        '<div class="error">Error loading assignments.</div>';
    console.error(error);
});
document.getElementById("gift")
.addEventListener("click", () => {
    const gift =
        document.getElementById("gift");
    gift.classList.add("shake");
setTimeout(() => {
    document.getElementById("giftArea")
        .style.display = "none";
    document.getElementById("recipientName")
        .innerHTML = assignedRecipient;
    document.getElementById("revealArea")
        .style.display = "block";
}, 700);
});
</script>
</body>
</html>
