<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Fluke Family Christmas Mission Control 🎄</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(#082c44,#0b4f3c);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.card{
    position:relative;
    max-width:900px;
    width:95%;
    margin:30px auto;
    background:rgba(22,92,71,.92);
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    z-index:5;
}

h1{
    text-align:center;
    margin-top:0;
}

.greeting{
    line-height:1.8;
    margin-top:20px;
}

.error{
    color:#ffcccc;
}

.primaryButton{
    background:#c62828;
    color:white;
    border:none;
    padding:16px 24px;
    border-radius:10px;
    font-size:1.1rem;
    cursor:pointer;
    margin-top:20px;
}

.primaryButton:hover{
    background:#b71c1c;
}

/* snow */

.snowflake{
    position:fixed;
    top:-20px;
    color:white;
    opacity:.8;
    pointer-events:none;
    animation:snowFall linear infinite;
}

@keyframes snowFall{

    from{
        transform:translateY(-20px);
    }

    to{
        transform:translateY(110vh);
    }

}

/* village */

.village{
    display:none;
    margin-top:30px;
    text-align:center;
}

.beacon{
    font-size:4rem;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

.house{
    font-size:5rem;
}

.status{
    margin-top:15px;
    font-size:1.1rem;
}

/* santa animation */

.sky{
    position:relative;
    height:180px;
    overflow:hidden;
    display:none;
    margin-top:20px;
}

.santa{
    position:absolute;
    font-size:4rem;
    left:-350px;
    top:20px;
}

.fly{
    animation:flyAcross 7s linear forwards;
}

@keyframes flyAcross{

    from{
        left:-350px;
    }

    to{
        left:110%;
    }

}

/* gift */

.gift{
    position:absolute;
    font-size:5rem;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    cursor:pointer;
}

.dropGift{
    display:block;
    animation:dropGift 1.5s forwards;
}

@keyframes dropGift{

    0%{
        top:20px;
    }

    75%{
        top:115px;
    }

    90%{
        top:95px;
    }

    100%{
        top:115px;
    }

}

.tapMessage{
    display:none;
    margin-top:150px;
}

.reveal{
    display:none;
    margin-top:25px;
    background:white;
    color:#222;
    padding:25px;
    border-radius:12px;
}

.recipient{
    font-size:2.2rem;
    font-weight:bold;
}

.complete{
    margin-top:15px;
    color:#066d3f;
}

</style>
